name: Open test PR

# Temporary helper for testing the approval flow: opens a pull request as
# github-actions[bot], so the owner is able to approve it. Removed after
# the test.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to open a pull request from
        required: true
      title:
        description: Pull request title
        required: true

permissions: {}

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
        run: |
          gh api "repos/$GH_REPO/pulls" -f base=dev -f head="$BRANCH" -f title="$TITLE" \
            -f body="Test of the pull request approval and auto-merge flow." --jq .html_url
