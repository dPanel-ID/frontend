name: CI

# Checks every pull request into dev. The job name `ci` is the required
# status check in the dev ruleset, so keep it stable. The owner bypasses
# the ruleset, so on the owner's pull requests it is information only.
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm exec eslint .

      - name: Test
        run: pnpm test

      - name: Build SPA static site
        # Same as the deploy: prerendering reaches its preview server through
        # `localhost`, which resolves to ::1 first on the runner.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: pnpm run build:static
