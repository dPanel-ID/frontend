name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://dnocs.devetek.app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA static site
        run: pnpm run build:static

      - name: Configure SPA fallback
        run: cp .output-static/client/index.html .output-static/client/404.html

      - name: Configure custom domain
        run: |
          printf '%s\n' 'dnocs.devetek.app' > .output-static/client/CNAME
          touch .output-static/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output-static/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
