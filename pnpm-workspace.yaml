allowBuilds:
  # Usage telemetry pulled in by the mock API (Prism); never needed.
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 1440
# Security floors for transitive dependencies (Dependabot alerts). Each entry
# raises only the vulnerable versions to the first patched release.
overrides:
  lodash@<4.18.0: ^4.18.1
  seroval@<1.6.8: ^1.6.8
  seroval-plugins@<1.6.8: ^1.6.8
  uuid@<11.1.1: ^11.1.1
  # TanStack Start 1.169+ needs Vite 8. Start stays on 1.168.61 (the last
  # release for Vite 7), so the router core it ships with is held to one copy.
  '@tanstack/router-core': 1.171.35
